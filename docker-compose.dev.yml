services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: s4p-frontend:dev
    command: sh -c "npm ci && npm run dev"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "${FRONTEND_PORT}:4173"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: s4p-backend:dev
    command: sh -c "npm ci && npm run dev"
    environment:
      NODE_OPTIONS: "--inspect=0.0.0.0:9229"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports: !override
      - "${BACKEND_PORT}:3001"
      - "9229:9229"

  nginx:
    profiles:
      - prod

volumes:
  frontend_node_modules:
  backend_node_modules: