services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    image: s4p-frontend:dev
    command: npm run dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://backend:3001
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports: !override
      - "${FRONTEND_PORT}:4173"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    image: s4p-backend:dev
    command: npm run dev
    environment:
      NODE_ENV: development
      SESSION_SECRET: development-only-session-secret
      # Windows bind mounts can update files without Linux filesystem events.
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
      # Avoid tsx's synchronous transform waiting on an esbuild worker under debugging.
      ESBUILD_WORKER_THREADS: "0"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports: !override
      - "${BACKEND_PORT}:3001"
      - "9229:9229"

  nginx:
    profiles:
      - prod

volumes:
  frontend_node_modules:
  backend_node_modules:
